name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish attested release
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.path == '.github/workflows/ci.yml' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      attestations: read
      contents: write
    steps:
      - name: Validate annotated tag and protected-main ancestry
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG_CANDIDATE: ${{ github.event.workflow_run.head_branch }}
          VERIFIED_CI_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail

          tag="$RELEASE_TAG_CANDIDATE"
          if [[ ! "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Release tag must use vMAJOR.MINOR.PATCH: $tag" >&2
            exit 1
          fi
          version="${BASH_REMATCH[1]}"

          tag_type="$(
            gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" \
              --jq '.object.type'
          )"
          tag_object_sha="$(
            gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" \
              --jq '.object.sha'
          )"
          if [[ "$tag_type" != "tag" ]]; then
            echo "Release tag must be annotated: $tag" >&2
            exit 1
          fi

          peeled_type="$(
            gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object_sha}" \
              --jq '.object.type'
          )"
          peeled_sha="$(
            gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object_sha}" \
              --jq '.object.sha'
          )"
          if [[ "$peeled_type" != "commit" || "$peeled_sha" != "$VERIFIED_CI_SHA" ]]; then
            echo "Annotated tag does not identify the commit verified by CI" >&2
            exit 1
          fi

          compare="$(
            gh api "repos/${GITHUB_REPOSITORY}/compare/${peeled_sha}...main"
          )"
          compare_status="$(jq --raw-output '.status' <<<"$compare")"
          merge_base_sha="$(jq --raw-output '.merge_base_commit.sha' <<<"$compare")"
          if [[ "$merge_base_sha" != "$peeled_sha" ]] \
            || [[ "$compare_status" != "ahead" && "$compare_status" != "identical" ]]; then
            echo "Release commit must be contained in protected main" >&2
            exit 1
          fi

          notes_file="$RUNNER_TEMP/release-notes.md"
          gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object_sha}" \
            --jq '.message' > "$notes_file"
          test -s "$notes_file"

          printf 'RELEASE_TAG=%s\n' "$tag" >> "$GITHUB_ENV"
          printf 'RELEASE_VERSION=%s\n' "$version" >> "$GITHUB_ENV"
          printf 'RELEASE_TAG_OBJECT_SHA=%s\n' "$tag_object_sha" >> "$GITHUB_ENV"
          printf 'VERIFIED_CI_SHA=%s\n' "$VERIFIED_CI_SHA" >> "$GITHUB_ENV"
          printf 'RELEASE_NOTES_FILE=%s\n' "$notes_file" >> "$GITHUB_ENV"
      - name: Download distributions from the verified CI run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions-${{ github.event.workflow_run.run_attempt }}
          path: dist
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Validate versioned artifacts and write checksums
        shell: bash
        run: |
          set -euo pipefail

          wheel="dist/omniscrape_zmarkus-${RELEASE_VERSION}-py3-none-any.whl"
          sdist="dist/omniscrape_zmarkus-${RELEASE_VERSION}.tar.gz"

          test -f "$wheel"
          test -f "$sdist"
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 2
          unzip -p "$wheel" \
            "omniscrape_zmarkus-${RELEASE_VERSION}.dist-info/METADATA" \
            | grep --fixed-strings --line-regexp "Version: ${RELEASE_VERSION}"
          tar -xOf "$sdist" \
            "omniscrape_zmarkus-${RELEASE_VERSION}/PKG-INFO" \
            | grep --fixed-strings --line-regexp "Version: ${RELEASE_VERSION}"

          (
            cd dist
            sha256sum -- \
              "omniscrape_zmarkus-${RELEASE_VERSION}-py3-none-any.whl" \
              "omniscrape_zmarkus-${RELEASE_VERSION}.tar.gz" \
              > SHA256SUMS
            sha256sum --check SHA256SUMS
          )
      - name: Verify tag-build provenance
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          wheel="dist/omniscrape_zmarkus-${RELEASE_VERSION}-py3-none-any.whl"
          sdist="dist/omniscrape_zmarkus-${RELEASE_VERSION}.tar.gz"
          for artifact in "$wheel" "$sdist"; do
            gh attestation verify "$artifact" \
              --repo "$GITHUB_REPOSITORY" \
              --source-ref "refs/tags/${RELEASE_TAG}" \
              --source-digest "$VERIFIED_CI_SHA" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yml"
          done
      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          current_tag_ref="$(
            gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}"
          )"
          current_tag_type="$(jq --raw-output '.object.type' <<<"$current_tag_ref")"
          current_tag_object_sha="$(jq --raw-output '.object.sha' <<<"$current_tag_ref")"
          if [[ "$current_tag_type" != "tag" ]] \
            || [[ "$current_tag_object_sha" != "$RELEASE_TAG_OBJECT_SHA" ]]; then
            echo "Release tag changed after validation" >&2
            exit 1
          fi

          gh release create "$RELEASE_TAG" \
            dist/*.whl \
            dist/*.tar.gz \
            dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --title "OmniScrape $RELEASE_TAG" \
            --verify-tag \
            --fail-on-no-commits \
            --notes-file "$RELEASE_NOTES_FILE" \
            --latest
