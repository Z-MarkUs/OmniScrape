name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  quality:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - name: Install quality tools and the minimum supported MCP SDK
        run: python -m pip install -e ".[dev,browser,llm,mcp]" "mcp==1.28.1"
      - run: python -m ruff check src tests benchmarks scripts
      - run: python -m ruff format --check src tests benchmarks scripts
      - run: python -m mypy src/omniscrape
      - run: python scripts/sync_agent_skills.py --check
      - name: Exercise the real MCP SDK contract
        run: python -m pytest tests/test_mcp_sdk.py --no-cov

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Offline tests with coverage
        run: python -m pytest --cov-fail-under=90
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.python-version == '3.12'
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

  browser-security:
    name: Browser policy (Playwright 1.48 floor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]" "playwright==1.48.0"
      - run: python -m playwright install --with-deps chromium
      - name: Allow Chromium to enter its user-namespace sandbox
        shell: bash
        run: |
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          if [[ -e /proc/sys/kernel/unprivileged_userns_clone ]]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
      - name: Real Chromium SSRF and compatibility regressions
        run: python -m pytest tests/test_browser_security.py --no-cov

  build:
    name: Build distributions and container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Verify distribution contents
        shell: bash
        run: |
          python - <<'PY'
          import pathlib
          import tarfile
          import zipfile

          distributions = sorted(pathlib.Path("dist").iterdir())
          assert distributions, "build produced no distributions"

          def validate(names: list[str], artifact: pathlib.Path) -> None:
              normalized = [name.replace("\\", "/") for name in names]
              forbidden = [
                  name for name in normalized
                  if "__pycache__" in name
                  or name.endswith((".pyc", ".pyo"))
                  or pathlib.PurePosixPath(name).name in {".env", ".DS_Store"}
              ]
              assert not forbidden, f"{artifact.name} contains generated/private files: {forbidden}"
              if artifact.suffix == ".whl":
                  required = ("omniscrape/py.typed", "omniscrape/web/index.html")
                  missing = [item for item in required if item not in normalized]
                  assert not missing, f"{artifact.name} is missing package data: {missing}"
              elif artifact.name.endswith(".tar.gz"):
                  required = (
                      "MANIFEST.in",
                      "CHANGELOG.md",
                      "CONTRIBUTING.md",
                      "SECURITY.md",
                      "RELEASING.md",
                      ".env.example",
                      "benchmarks/run.py",
                      "docs/assets/omniscrape-hero.svg",
                      "scripts/sync_agent_skills.py",
                      "tests/conftest.py",
                      "tests/fixtures/article.html",
                      "tests/fixtures/product.html",
                      "tests/fixtures/redirect-target.html",
                      "tests/fixtures/security.html",
                      ".agents/skills/omniscrape/SKILL.md",
                      ".claude/skills/omniscrape/SKILL.md",
                  )
                  missing = [
                      item
                      for item in required
                      if not any(name.endswith(f"/{item}") for name in normalized)
                  ]
                  assert not missing, f"{artifact.name} is missing test support files: {missing}"

          for artifact in distributions:
              if artifact.suffix == ".whl":
                  with zipfile.ZipFile(artifact) as archive:
                      validate(archive.namelist(), artifact)
              elif artifact.name.endswith(".tar.gz"):
                  with tarfile.open(artifact, "r:gz") as archive:
                      validate(archive.getnames(), artifact)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
      - name: Install and smoke-test exact distributions
        shell: bash
        run: |
          set -euo pipefail

          version="$(
            python - <<'PY'
          import pathlib
          import tomllib

          with pathlib.Path("pyproject.toml").open("rb") as file:
              print(tomllib.load(file)["project"]["version"])
          PY
          )"
          wheel="dist/omniscrape_zmarkus-${version}-py3-none-any.whl"
          sdist="dist/omniscrape_zmarkus-${version}.tar.gz"
          test -f "$wheel"
          test -f "$sdist"

          smoke_distribution() {
            local artifact="$1"
            local environment_name="$2"
            local environment="$RUNNER_TEMP/$environment_name"

            python -m venv "$environment"
            "$environment/bin/python" -m pip install \
              --disable-pip-version-check "$artifact"
            "$environment/bin/python" -m pip check
            "$environment/bin/omniscrape" --help >/dev/null
            "$environment/bin/python" - "$version" <<'PY'
          import asyncio
          import importlib.metadata
          import importlib.resources
          import sys

          import httpx

          import omniscrape

          expected_version = sys.argv[1]
          assert omniscrape.__version__ == expected_version
          assert importlib.metadata.version("omniscrape-zmarkus") == expected_version

          package_root = importlib.resources.files("omniscrape")
          for asset in ("index.html", "styles.css", "app.js"):
              assert package_root.joinpath("web", asset).is_file(), asset

          async def smoke_api() -> None:
              app = omniscrape.create_app()
              transport = httpx.ASGITransport(app=app, raise_app_exceptions=True)
              try:
                  async with httpx.AsyncClient(
                      transport=transport, base_url="http://127.0.0.1"
                  ) as client:
                      health = await client.get("/health")
                      assert health.status_code == 200
                      assert health.json()["version"] == expected_version
                      assert (await client.get("/")).status_code == 200
                      assert (await client.get("/assets/app.js")).status_code == 200
              finally:
                  await app.state.scraper.aclose()

          asyncio.run(smoke_api())
          PY
          }

          smoke_distribution "$wheel" "omniscrape-wheel-smoke"
          smoke_distribution "$sdist" "omniscrape-sdist-smoke"
      - name: Build production image
        run: docker build --tag omniscrape:ci .
      - name: Smoke-test production image
        shell: bash
        run: |
          set -euo pipefail
          container="omniscrape-ci-smoke"

          cleanup() {
            docker rm --force "$container" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --detach --name "$container" \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --env OMNISCRAPE_API_KEY=ci-smoke-only \
            --env OMNISCRAPE_ALLOWED_HOSTS=127.0.0.1 \
            --publish 127.0.0.1:18000:8000 \
            omniscrape:ci

          for _attempt in {1..30}; do
            if curl --fail --silent --show-error \
              http://127.0.0.1:18000/healthz >/dev/null; then
              exit 0
            fi
            if ! docker inspect --format '{{.State.Running}}' "$container" \
              | grep --quiet --extended-regexp '^true$'; then
              docker logs "$container"
              exit 1
            fi
            sleep 1
          done

          docker logs "$container"
          exit 1

  security:
    name: Security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,browser,llm,mcp]"
      - name: Audit runtime dependency resolution
        run: python -m pip_audit .
      - name: Audit development toolchain
        run: python -m pip_audit --skip-editable
      - name: Static security analysis
        run: python -m bandit -q -r src/omniscrape

  provenance:
    name: Attest release distributions
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - quality
      - tests
      - browser-security
      - build
      - security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions-${{ github.run_attempt }}
          path: dist
      - name: Validate tag and distribution metadata
        shell: bash
        run: |
          set -euo pipefail

          tag="$GITHUB_REF_NAME"
          if [[ ! "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Release tag must use vMAJOR.MINOR.PATCH: $tag" >&2
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          wheel="dist/omniscrape_zmarkus-${version}-py3-none-any.whl"
          sdist="dist/omniscrape_zmarkus-${version}.tar.gz"

          test -f "$wheel"
          test -f "$sdist"
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 2
          unzip -p "$wheel" \
            "omniscrape_zmarkus-${version}.dist-info/METADATA" \
            | grep --fixed-strings --line-regexp "Version: ${version}"
          tar -xOf "$sdist" \
            "omniscrape_zmarkus-${version}/PKG-INFO" \
            | grep --fixed-strings --line-regexp "Version: ${version}"
      - name: Attest tag-build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
