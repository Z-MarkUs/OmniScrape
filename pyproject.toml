[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omniscrape"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "fastapi", "uvicorn[standard]",
  "httpx>=0.27.0", "tenacity",
  "playwright>=1.47.0",
  "readability-lxml", "lxml", "beautifulsoup4",
  "trafilatura", "extruct", "w3lib", "python-dateutil",
  "pydantic>=2.7.0", "pydantic-settings",
  "scrapegraphai>=1.6.0",         # open-source extraction brain
  "tiktoken",                      # optional: token budget checks
  "orjson"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["old*"]

[tool.uvicorn]
factory = false
